#
# PiriCAD CI. piricad.md §14: 3 OS × (Debug + Release), ASan as a separate job,
# under 20 minutes per PR. CLAUDE.md 5.14: never merge on a red gate, and
# continue-on-error on a gate is forbidden.
name: CI

# MANUAL ONLY, by the maintainer's decision. `push` and `pull_request` triggers
# are deliberately absent: this runs when somebody asks for it, from the Actions
# tab or `gh workflow run ci.yml`, and never on its own.
#
# What this does NOT change: CLAUDE.md 5.14 still forbids merging on a red gate,
# and 6.1/6.2 still make a green `make check` part of being finished. The gates
# did not become optional — they moved from "a robot runs them on every push" to
# "they are run before the work is called done", which on this project is `make
# check` locally.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CMAKE_GENERATOR: Ninja

jobs:
  gates:
    name: CI gates
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Run every gate
        run: |
          fail=0
          for gate in scripts/ci-gate-*.sh; do
            echo "::group::$gate"
            bash "$gate" || fail=1
            echo "::endgroup::"
          done
          exit $fail

  build:
    name: ${{ matrix.os }} / ${{ matrix.config }}
    needs: gates
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
        config: [debug, release]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.*'
          modules: 'qtshadertools'
          cache: true

      - uses: hendrikmuhs/ccache-action@v1
        with:
          key: ${{ matrix.os }}-${{ matrix.config }}

      - name: Configure
        run: cmake --preset ${{ matrix.config }}

      - name: Build
        run: cmake --build --preset ${{ matrix.config }}

      - name: Test
        if: matrix.config == 'debug'
        run: ctest --test-dir build/${{ matrix.config }} --output-on-failure

      - name: Upload artefacts
        if: matrix.config == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: piricad-${{ matrix.os }}
          path: build/release/bin/

  sanitizers:
    name: ASan + UBSan
    needs: gates
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.*'
          cache: true
      - run: cmake --preset asan
      - run: cmake --build --preset asan
      - run: ctest --test-dir build/asan --output-on-failure
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1

  headless:
    name: Headless core (no Qt)
    needs: gates
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: cmake --preset headless
      - run: cmake --build --preset headless
      - run: ctest --test-dir build/headless --output-on-failure

  determinism:
    name: Cross-platform bit identity
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Golden fixtures must not have been regenerated during the run
        run: |
          # piricad.md §7.3: every OS in the `build` matrix replays the same
          # fixtures in tests/golden/beklenen and fails if its output differs, so
          # the three-way comparison happens there. What is left to check is that
          # nobody quietly regenerated a fixture to make a platform agree.
          if ! git diff --quiet -- tests/golden/beklenen; then
            echo "::error::golden fixtures changed during CI — regenerate deliberately, review the diff"
            git diff --stat -- tests/golden/beklenen
            exit 1
          fi
          echo "golden fixtures unchanged; per-platform comparison ran in the build matrix"

  bench:
    name: Performance budgets
    needs: gates
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.*'
          cache: true
      - run: cmake --preset release
      - run: cmake --build --preset release --target piricad_bench
      - name: Budgets are gates, not aspirations (piricad.md §10.1)
        run: ./build/release/bin/piricad_bench
