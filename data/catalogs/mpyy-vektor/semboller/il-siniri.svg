<!-- MPYY EK-1a · İL SINIRI, one period of the printed line type: a long dash, a
     gap, a dot, a gap. Kept as a picture only so the shape can be looked at; the
     drawing itself uses the dash pattern, which turns a corner. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 6" width="40" height="6">
  <path d="M 0 3 L 24 3" stroke="#000000" stroke-width="2" stroke-linecap="butt"/>
  <circle cx="32" cy="3" r="1.2" fill="#000000"/>
</svg>
