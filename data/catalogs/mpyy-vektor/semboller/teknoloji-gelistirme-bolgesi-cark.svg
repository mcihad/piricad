<?xml version="1.0" encoding="UTF-8"?>
<!-- MPYY EK-1a · TEKNOLOJİ GELİŞTİRME BÖLGESİ. Sınır boyunca üçlü gruplar hâlinde basılan, içi boş 12 dişli çark. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 606 100" width="606" height="100">
  <defs>
    <mask id="delik" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
      <rect width="100" height="100" fill="#FFFFFF"/>
      <circle cx="50" cy="50" r="28" fill="#000000"/>
    </mask>
    <g id="cark" fill="#000000" mask="url(#delik)">
      <circle cx="50" cy="50" r="43"/>
      <rect x="46" y="0" width="8" height="16"/>
      <rect x="46" y="0" width="8" height="16" transform="rotate(30 50 50)"/>
      <rect x="46" y="0" width="8" height="16" transform="rotate(60 50 50)"/>
      <rect x="46" y="0" width="8" height="16" transform="rotate(90 50 50)"/>
      <rect x="46" y="0" width="8" height="16" transform="rotate(120 50 50)"/>
      <rect x="46" y="0" width="8" height="16" transform="rotate(150 50 50)"/>
      <rect x="46" y="0" width="8" height="16" transform="rotate(180 50 50)"/>
      <rect x="46" y="0" width="8" height="16" transform="rotate(210 50 50)"/>
      <rect x="46" y="0" width="8" height="16" transform="rotate(240 50 50)"/>
      <rect x="46" y="0" width="8" height="16" transform="rotate(270 50 50)"/>
      <rect x="46" y="0" width="8" height="16" transform="rotate(300 50 50)"/>
      <rect x="46" y="0" width="8" height="16" transform="rotate(330 50 50)"/>
    </g>
  </defs>
  <g>
    <use href="#cark" transform="translate(36 0)"/>
    <use href="#cark" transform="translate(162 0)"/>
    <use href="#cark" transform="translate(517 0)"/>
  </g>
</svg>
